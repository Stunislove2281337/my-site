<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Головна сторінка</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f9f9f9;
}

/* ====== КОНТЕЙНЕР ====== */
.wrapper{
    width:1200px;
    margin:0 auto;
}

/* ====== ШАПКА ====== */
header{
    background:#f2f2f2;
    padding:20px;
}

.header-container{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* FLEX-ЕЛЕМЕНТИ */
.header-center{
    flex:1;
    text-align:center;
    padding:0 20px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-img{
    width:150px;
    height:150px;
    object-fit:cover;
}

/* ====== МЕНЮ ====== */
nav{
    display:flex;
    justify-content:center;
    background:#0066cc;
}

nav a{
    padding:14px 20px;
    color:white;
    text-decoration:none;
}

nav a:hover{
    background:#004d99;
}

/* ====== БАНЕР ====== */
.banner{
    background:#00b8cc;
    color:white;
    text-align:center;
    padding:40px;
}

/* ====== КОНТЕНТ ====== */
.container{
    display:flex;
    gap:20px;
    margin:20px 0;
    align-items:stretch; /* однакова висота колонок */
}

/* ЛІВА ЧАСТИНА */
.content{
    flex:3;
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    order:1;
}

/* БЛОКИ */
.block{
    flex:1 1 45%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;

    background:white;
    padding:15px;
    border-radius:5px;
    border:1px solid #ddd;
}

/* ПРАВА ЧАСТИНА */
.sidebar{
    flex:1;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    order:2;
}

.ad{
    background:#ffcc00;
    padding:30px;
    text-align:center;
    border-radius:5px;
    font-weight:bold;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* ====== АДАПТИВНІСТЬ ====== */
@media screen and (max-width:768px){

    .wrapper{
        width:100%;
    }

    .container{
        flex-direction:column;
    }

    /* зміна порядку */
    .content{
        order:2;
    }

    .sidebar{
        order:1;
    }

    .block{
        flex:1 1 100%;
    }
}

</style>
</head>

<body>

<div class="wrapper">

<header>
  <div class="header-container">

    <img src="photo.png" class="icon-img">

    <div class="header-center">
      <h1>ТНТУ ім. Івана Пулюя</h1>
      <h2>Факультет ФІС</h2>
      <h2>Кафедра комп’ютерних наук</h2>
    </div>

    <div class="header-right">
      <img src="logo1.png" class="icon-img">
      <img src="logo2.png" class="icon-img">
      <div>Персональна Сторінка:<br>Ярмолюка Станіслава,<br>група СП-33</div>
    </div>

  </div>
</header>

<nav>
  <a href="#">Головна</a>
  <a href="biography.html">Біографія</a>
  <a href="mygroup.html">Група</a>
  <a href="hobby.html">Хоббі</a>
  <a href="interesting.html">Цікаве</a>
</nav>

<div class="banner">
  Головний інформаційний блок
</div>

<div class="container">

  <div class="content">

    <div class="block">
      <h3>Біографія</h3>
      <p>Коротка інформація</p>
    </div>

    <div class="block">
      <h3>Група</h3>
      <p>СП-33</p>
    </div>

    <div class="block">
      <h3>Хоббі</h3>
      <p>Опис</p>
    </div>

    <div class="block">
      <h3>Цікаве</h3>
      <p>Факти</p>
    </div>

  </div>

  <div class="sidebar">

    <div class="ad">Реклама 1</div>
    <div class="ad">Реклама 2</div>
    <div class="ad">Реклама 3</div>

  </div>

</div>

</div>

</body>
</html>
